name: External links

# External links rot silently and some sites rate-limit bots, so this runs on a
# schedule instead of on every pull request. A failed run is emailed to the owner.
# GitHub disables scheduled workflows after 60 days without repository activity.
on:
  schedule:
    - cron: "17 6 * * 1"   # Mondays 06:17 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  links:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check external links
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          # 403 and 429: sites that block or rate-limit automated clients
          args: >-
            --no-progress
            --scheme https --scheme http
            --max-retries 3
            --timeout 20
            --accept 200..=299,403,429
            --exclude "^https?://(127\.0\.0\.1|localhost|example\.(com|org))"
            "docs/**/*.md"
          fail: true
        env:
          # authenticated requests to github.com are not rate-limited as hard
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
