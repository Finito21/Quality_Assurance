site_name: QA Notes
site_url: https://finito21.github.io/Quality_Assurance/
use_directory_urls: false

theme: 
  name: material
  palette:

    # Dark mode
    - scheme: default
      primary: blue
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Przełącz na tryb jasny

    # Light mode
    - scheme: slate
      primary: blue
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Przełącz na tryb ciemny

nav:
  - Introduction: index.md

  - Fundamentals:
      - QA Fundamentals : fundamentals/qa_fundamentals.md

  - Technologies:
      - Frontend:
        - HTML: technologies/frontend/html.md
        - CSS: technologies/frontend/css.md
        - JavaScript: technologies/frontend/javascript.md

      - Backend:
        - Sql: technologies/backend/sql.md

      - API Testing:
        - API Fundamentals: technologies/api_testing/api_fundamentals.md
        - API Automation: technologies/api_testing/api_automation.md

  - Tools:
      - Devtools: tools/devtools.md

      - GIT:
        - Git Basics: tools/git/git_basics.md
        - GitHub: tools/git/github.md

      - CI/CD:
        - Jenkins: tools/ci_cd/jenkins.md
        - GitHub Actions: tools/ci_cd/github_actions.md

      - Monitoring:
        - Grafana: tools/monitoring/grafana.md
        
      - Test Management:
        - Jira: tools/test_management/jira.md
        - Confluence: tools/test_management/confluence.md
        - Slack: tools/test_management/slack.md
        - TestLink: tools/test_management/testlink.md
        - Xray: tools/test_management/xray.md
      
      - API Testing Tools:
        - Postman: tools/api_testing_tools/postman.md
        - SoapUI: tools/api_testing_tools/soapui.md
        - Swagger: tools/api_testing_tools/swagger.md

  - Recruitment:
      - QA Questions: recruitment/qa_questions.md
      - Technical Tasks: recruitment/technical_tasks.md

  - Sample Project:
      - Sample Project: sample_project/sample_project.md
  - Resources: resources.md

plugins:
  - search
  - i18n:
      languages:
        - locale: pl
          name: 🇵🇱 Polski
          build: true
          default: true

        - locale: en
          name: 🇬🇧 English
          build: true

markdown_extensions:
  - admonition
  - toc:
      permalink: true
  - tables
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.details